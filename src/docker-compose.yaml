services:
  backend:
    image: dir.esilva.org/esilva/expensesweb:v0.1.0
    container_name: expensesweb
    hostname: expensesweb
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - "./config.yaml:/usr/share/webapps/expensesweb/config.yaml"
    restart: unless-stopped

  database:
    image: docker.io/library/postgres:16
    container_name: expenses-dev-db
    hostname: expenses-dev-db
    env_file:
      - .pgenv
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d expenses"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
